<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Private gallery of select projects by Cow Rock Construction in Cashiers, NC. Most clients prefer not to publish projects publicly.">
    <title>Cow Rock Construction - Gallery</title>
    <link rel="canonical" href="https://www.cowrock.com/gallery.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cow Rock Construction - Gallery">
    <meta property="og:description" content="Private gallery of select projects by Cow Rock Construction in Cashiers, NC. Most clients prefer not to publish projects publicly.">
    <meta property="og:url" content="https://www.cowrock.com/gallery.html">
    <meta property="og:image" content="https://www.cowrock.com/logo-960.webp">
    <link rel="icon" type="image/png" href="COWROCK_SECONDARY_BLUE_OUTLINE.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing);
            margin-block-start: var(--spacing);
            padding-block-end: var(--spacing);
        }
        .photo-gallery picture {
            display: block;
            width: 100%;
        }
        .photo-gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border-radius: 4px;
        }
        .photo-gallery img:hover {
            transform: scale(1.8);
            z-index: 10;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 80%;
            max-height: 82vh;
            margin-top: 5%;
            object-fit: contain;
        }
        .close {
            position: absolute;
            top: 16px;
            right: 24px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            z-index: 1002;
        }
        .close:hover,
        .modal-nav:hover {
            color: #ddd;
        }
        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: 0;
            color: #fff;
            font-size: 56px;
            line-height: 1;
            cursor: pointer;
            padding: 12px 18px;
            z-index: 1002;
            user-select: none;
        }
        .modal-nav.prev { left: 8px; }
        .modal-nav.next { right: 8px; }
        .modal-caption {
            text-align: center;
            color: #ccc;
            padding: 10px;
        }
        @media (max-width: 700px) {
            .modal-content { max-width: 92%; margin-top: 18%; }
            .modal-nav { font-size: 40px; padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <nav class="menu" id="navMenu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="aboutus.html">About Us</a></li>
        </ul>
    </nav>
    <main class="container">
        <div class="logo">
            <picture>
                <source srcset="logo-960.webp" type="image/webp">
                <img src="COWROCK_PRIMARY_NAVY.png" alt="" width="960" height="354" decoding="async">
            </picture>
            <h1 class="visually-hidden">Gallery — Cow Rock Construction</h1>
        </div>
        <div class="content">
            <p>Most of our clients prefer not to publish their projects on the Internet. Please make an appointment to visit our projects in person.</p>
        </div>
        <div class="photo-gallery" id="photoGallery"></div>
    </main>
    <footer>
        © <span id="year"></span> Cow Rock Construction. All rights reserved.
    </footer>
    <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-label="Project photo">
        <button type="button" class="close" id="modalClose" aria-label="Close">&times;</button>
        <button type="button" class="modal-nav prev" id="modalPrev" aria-label="Previous photo">&#8249;</button>
        <img class="modal-content" id="modalImage" alt="">
        <button type="button" class="modal-nav next" id="modalNext" aria-label="Next photo">&#8250;</button>
        <div class="modal-caption" id="modalCaption"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            const toggle = document.querySelector('#menuToggle');
            const nav = document.querySelector('#navMenu');
            toggle.addEventListener('click', () => {
                const isActive = toggle.classList.toggle('active');
                nav.classList.toggle('active');
                toggle.setAttribute('aria-expanded', isActive);
            });

            const galleryContainer = document.getElementById('photoGallery');
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const caption = document.getElementById('modalCaption');
            const imageFiles = [
                'CRC201', 'CRC202', 'CRC203', 'CRC204', 'CRC205', 'CRC206',
                'CRC001', 'CRC002', 'CRC003', 'CRC004', 'CRC005',
                'CRC006', 'CRC007', 'CRC008', 'CRC009',
                'CRC101', 'CRC102', 'CRC103', 'CRC104', 'CRC105',
                'CRC106', 'CRC107', 'CRC108', 'CRC109', 'CRC110',
                'CRC111', 'CRC112', 'CRC113', 'CRC114', 'CRC115',
                'CRC116'
            ];
            let currentIndex = 0;
            let touchStartX = 0;

            const setWithFallback = (el, base) => {
                el.onerror = () => {
                    el.onerror = null;
                    el.src = base + '.jpg';
                };
                el.src = base + '.webp';
            };

            const isOpen = () => modal.style.display === 'block';

            const showAt = (index) => {
                currentIndex = (index + imageFiles.length) % imageFiles.length;
                const base = imageFiles[currentIndex];
                setWithFallback(modalImg, base);
                modalImg.alt = 'Cow Rock Construction project photo';
                caption.textContent = (currentIndex + 1) + ' / ' + imageFiles.length;
            };

            const openAt = (index) => {
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
                showAt(index);
            };

            const closeModal = () => {
                modal.style.display = 'none';
                document.body.style.overflow = '';
            };

            imageFiles.forEach((base, index) => {
                const picture = document.createElement('picture');
                const source = document.createElement('source');
                source.srcset = base + '.webp';
                source.type = 'image/webp';
                const img = document.createElement('img');
                img.alt = 'Cow Rock Construction project photo';
                img.loading = 'lazy';
                img.decoding = 'async';
                setWithFallback(img, base);
                img.addEventListener('click', () => openAt(index));
                picture.appendChild(source);
                picture.appendChild(img);
                galleryContainer.appendChild(picture);
            });

            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('modalPrev').addEventListener('click', (e) => {
                e.stopPropagation();
                showAt(currentIndex - 1);
            });
            document.getElementById('modalNext').addEventListener('click', (e) => {
                e.stopPropagation();
                showAt(currentIndex + 1);
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (!isOpen()) return;
                if (e.key === 'Escape') closeModal();
                if (e.key === 'ArrowLeft') showAt(currentIndex - 1);
                if (e.key === 'ArrowRight') showAt(currentIndex + 1);
            });
            modal.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            modal.addEventListener('touchend', (e) => {
                const dx = e.changedTouches[0].screenX - touchStartX;
                if (dx > 50) showAt(currentIndex - 1);
                if (dx < -50) showAt(currentIndex + 1);
            }, { passive: true });
        });
    </script>
</body>
</html>
