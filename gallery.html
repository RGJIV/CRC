<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cow Rock Construction - Gallery</title>
    <link rel="icon" type="image/png" href="COWROCK_SECONDARY_BLUE_OUTLINE.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .logo {
            width: 33.333%;
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing);
            margin-block-start: var(--spacing);
            padding-block-end: var(--spacing);
        }

        .photo-gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border-radius: 4px;
        }

        .photo-gallery img:hover {
            transform: scale(1.8);
            z-index: 10;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Simple modal for enlarged view */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            margin-top: 5%;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-caption {
            text-align: center;
            color: #ccc;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="menu-toggle" id="menuToggle">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <nav class="menu" id="navMenu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="aboutus.html">About Us</a></li>
        </ul>
    </nav>
    <main class="container">
        <div class="logo">
            <img src="COWROCK_PRIMARY_NAVY.png" alt="Cow Rock Construction Logo">
        </div>
        <div class="content">
            <p>Most of our clients prefer not to publish their projects on the Internet. Please make an appointment to visit our projects in person.</p>
        </div>
        <div class="photo-gallery" id="photoGallery">
            <!-- Images populated dynamically via JavaScript for maintainability -->
        </div>
    </main>
    <footer>
        © <script>document.write(new Date().getFullYear())</script> Cow Rock Construction. All rights reserved.
    </footer>

    <!-- Image Modal -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
        <div class="modal-caption" id="modalCaption"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mobile menu toggle
            const toggle = document.querySelector('#menuToggle');
            const nav = document.querySelector('#navMenu');
            toggle.addEventListener('click', () => [toggle, nav].forEach(el => el.classList.toggle('active')));

            // Dynamic gallery population - only existing images
            const galleryContainer = document.getElementById('photoGallery');
            const imageFiles = [
                'CRC001.png', 'CRC002.png', 'CRC003.png', 'CRC004.png', 'CRC005.png',
                'CRC006.png', 'CRC007.png', 'CRC008.png', 'CRC009.png',
                'CRC101.png', 'CRC102.png', 'CRC103.png', 'CRC104.png', 'CRC105.png',
                'CRC106.png', 'CRC107.png', 'CRC108.png', 'CRC109.png', 'CRC110.png',
                'CRC111.png', 'CRC112.png', 'CRC113.png', 'CRC114.png', 'CRC115.png',
                'CRC116.png'
            ];

            imageFiles.forEach((file, index) => {
                const img = document.createElement('img');
                img.src = file;
                img.alt = `Cow Rock Construction project photo ${file.replace('.png', '')}`;
                img.loading = 'lazy';
                img.title = `Click to enlarge - ${file}`;

                // Click to open modal
                img.addEventListener('click', () => {
                    const modal = document.getElementById('imageModal');
                    const modalImg = document.getElementById('modalImage');
                    const caption = document.getElementById('modalCaption');
                    modal.style.display = 'block';
                    modalImg.src = file;
                    caption.textContent = `Cow Rock Construction - ${file.replace('.png', '')}`;
                });

                galleryContainer.appendChild(img);
            });

            // Modal close functionality
            const modal = document.getElementById('imageModal');
            const closeBtn = modal.querySelector('.close');
            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });

            // Keyboard escape to close modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.style.display === 'block') {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
