<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Private gallery of select projects by Cow Rock Construction in Cashiers, NC. Most clients prefer not to publish projects publicly.">
    <title>Cow Rock Construction - Gallery</title>
    <link rel="canonical" href="https://www.cowrock.com/gallery.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cow Rock Construction - Gallery">
    <meta property="og:description" content="Private gallery of select projects by Cow Rock Construction in Cashiers, NC. Most clients prefer not to publish projects publicly.">
    <meta property="og:url" content="https://www.cowrock.com/gallery.html">
    <meta property="og:image" content="https://www.cowrock.com/logo-960.webp">
    <link rel="icon" type="image/png" href="COWROCK_SECONDARY_BLUE_OUTLINE.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing);
            margin-block-start: var(--spacing);
            padding-block-end: var(--spacing);
        }

        .photo-gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border-radius: 4px;
        }

        .photo-gallery img:hover {
            transform: scale(1.8);
            z-index: 10;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            margin-top: 5%;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-caption {
            text-align: center;
            color: #ccc;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <nav class="menu" id="navMenu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="aboutus.html">About Us</a></li>
        </ul>
    </nav>
    <main class="container">
        <div class="logo">
            <picture>
                <source srcset="logo-960.webp" type="image/webp">
                <img src="COWROCK_PRIMARY_NAVY.png" alt="" width="960" height="354" decoding="async">
            </picture>
            <h1 class="visually-hidden">Gallery — Cow Rock Construction</h1>
        </div>
        <div class="content">
            <p>Most of our clients prefer not to publish their projects on the Internet. Please make an appointment to visit our projects in person.</p>
        </div>
        <div class="photo-gallery" id="photoGallery">
            <!-- Images populated dynamically via JavaScript -->
        </div>
    </main>
    <footer>
        © <span id="year"></span> Cow Rock Construction. All rights reserved.
    </footer>

    <!-- Image Modal -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
        <div class="modal-caption" id="modalCaption"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();

            const toggle = document.querySelector('#menuToggle');
            const nav = document.querySelector('#navMenu');

            toggle.addEventListener('click', () => {
                const isActive = toggle.classList.toggle('active');
                nav.classList.toggle('active');
                toggle.setAttribute('aria-expanded', isActive);
            });

            const galleryContainer = document.getElementById('photoGallery');
            const imageFiles = [
                'CRC001.jpg', 'CRC002.jpg', 'CRC003.jpg', 'CRC004.jpg', 'CRC005.jpg',
                'CRC006.jpg', 'CRC007.jpg', 'CRC008.jpg', 'CRC009.jpg',
                'CRC101.jpg', 'CRC102.jpg', 'CRC103.jpg', 'CRC104.jpg', 'CRC105.jpg',
                'CRC106.jpg', 'CRC107.jpg', 'CRC108.jpg', 'CRC109.jpg', 'CRC110.jpg',
                'CRC111.jpg', 'CRC112.jpg', 'CRC113.jpg', 'CRC114.jpg', 'CRC115.jpg',
                'CRC116.jpg'
            ];

            imageFiles.forEach((file) => {
                const img = document.createElement('img');
                img.src = file;
                img.alt = `Cow Rock Construction project photo ${file.replace('.jpg', '')}`;
                img.loading = 'lazy';
                img.title = `Click to enlarge - ${file}`;

                img.addEventListener('click', () => {
                    const modal = document.getElementById('imageModal');
                    const modalImg = document.getElementById('modalImage');
                    const caption = document.getElementById('modalCaption');
                    modal.style.display = 'block';
                    modalImg.src = file;
                    caption.textContent = `Cow Rock Construction - ${file.replace('.jpg', '')}`;
                });

                galleryContainer.appendChild(img);
            });

            const modal = document.getElementById('imageModal');
            const closeBtn = modal.querySelector('.close');
            closeBtn.addEventListener('click', () => modal.style.display = 'none');
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.style.display === 'block') {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
